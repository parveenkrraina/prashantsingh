name: Validate for Hostinger Deployment

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: hostinger-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate application
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run lint

      - name: Build application
        run: npm run build

      - name: Verify production entry point
        shell: bash
        run: test -f dist/server.cjs && test -f dist/index.html

  # Hostinger performs the actual deployment through its native GitHub
  # integration after a validated change is merged into main. Protect the
  # main branch and require this workflow to pass before merging.
